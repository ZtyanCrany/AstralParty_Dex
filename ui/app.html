<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星趴档案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#F0EEE6; --side:#E3DACC; --card:#FFFFFF; --line:#D9D2C4;
    --ink:#2B2823; --dim:#8A8377; --accent:#C8553D; --ok:#4A7C59;
    --gold:#C99A2E; --blue:#4A6FA5;
  }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#D2CABA; border-radius:5px;
    border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background:#BDB3A0; }
  body{ font-family:'Noto Sans SC','Noto Sans',system-ui,-apple-system,sans-serif;
        background:var(--bg); color:var(--ink); font-size:14px;
        -webkit-font-smoothing:antialiased; overflow:hidden; }
  #app{ display:flex; height:100vh; }

  /* ── 侧边栏 ── */
  #side{ width:184px; background:var(--side); flex:0 0 184px;
         padding:24px 0 0; display:flex; flex-direction:column; }
  #side h1{ font-size:15.5px; padding:0 20px 20px; letter-spacing:.6px; font-weight:700; }
  #side h1 span{ color:var(--accent); }
  .nav{ padding:10px 20px; color:var(--dim); cursor:pointer; font-size:13.5px;
        border-left:3px solid transparent; transition:.15s; }
  .nav:hover{ color:var(--ink); }
  /* 登录页那条「从本机游戏补全头像资源」的进度：后台跑，不挡登录 */
  .arthint{ margin-top:16px; font-size:12px; color:#8C8577; display:flex;
            align-items:center; gap:8px; line-height:1.5; }
  .arthint .bar{ flex:0 0 110px; height:4px; border-radius:2px; background:#E7E1D3; overflow:hidden; }
  .arthint .bar>i{ display:block; height:100%; width:0; background:#C9A26B; transition:width .3s; }
  .nav.on{ color:var(--ink); border-left-color:var(--accent);
           background:rgba(255,255,255,.55); font-weight:600; }
  .nav.lock{ opacity:.32; pointer-events:none; }
  #who{ margin-top:auto; padding:14px 20px 18px; font-size:11px; color:#A79F91;
        line-height:1.55; }
  #who b{ display:block; color:#8A8377; font-weight:600; margin-bottom:2px; }
  .modal{ position:fixed; inset:0; z-index:120; display:flex; align-items:center;
          justify-content:center; background:rgba(62,56,46,.30); transition:opacity .18s; }
  .modal.hide{ opacity:0; pointer-events:none; }
  .mbox{ width:356px; background:#FCFAF6; border-radius:14px; padding:22px 24px 18px;
         box-shadow:0 18px 50px rgba(70,60,40,.26); }
  .mtitle{ font-size:15px; font-weight:600; color:#4E4739; margin-bottom:9px; }
  .mtext{ font-size:12.5px; color:#7E7565; line-height:1.9; margin-bottom:19px; }
  .mbtns{ display:flex; gap:9px; justify-content:flex-end; }
  .savemsg{ display:none; margin-top:14px; padding:10px 15px;
            font-size:12.5px; line-height:1.75; color:#3F6344;
            background:#E9F2E4; border:1px solid #CBE0C0; border-left:3px solid #7FA873;
            border-radius:10px; word-break:break-all; }
  .savemsg.on{ display:block; }
  .savemsg.bad{ color:#7A3A1E; background:#F6E3D8;
                border-color:#E4C3AE; border-left-color:#B4633A; }
  #boot{ position:fixed; inset:0; z-index:99; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:17px; background:#F0EEE6;
         transition:opacity .35s; }
  #boot.hide{ opacity:0; pointer-events:none; }
  .bspin{ width:34px; height:34px; border:3px solid #E2DAC7; border-top-color:#BFA167;
          border-radius:50%; animation:bspin .9s linear infinite; }
  @keyframes bspin{ to{ transform:rotate(360deg); } }
  .btext{ font-size:15px; color:#6B6252; letter-spacing:.3px; }
  .btext b{ color:#8A6420; font-weight:600; }
  .bsub{ font-size:12px; color:#ABA393; }
  #who .ver{ display:block; margin-top:6px; color:#B5AC9B; font-size:10.5px; }
  #who .logout{ display:block; width:100%; margin:0 0 10px; padding:6px 0;
    font-family:inherit; font-size:11.5px; color:#9A8F7A; background:#EBE4D4;
    border:0; border-radius:8px; cursor:pointer; }
  #who .logout:hover{ background:#E1D8C6; color:#7A6F58; }
  .lastlogin{ margin:12px 0 0; padding:9px 12px; font-size:12px; line-height:1.8;
    color:#7E7565; background:#F7F4EC; border:1px solid #E7E0CE; border-radius:9px; }
  .lastlogin b{ color:#5C5445; font-weight:600; }
  .lastlogin .warn{ color:#B4633A; }
  .lastlogin .forget{ color:#B3AA98; font-size:11px; cursor:pointer; }
  .lastlogin .forget:hover{ color:#B4633A; text-decoration:underline; }

  /* ── 主区 ── */
  #main{ flex:1; overflow-y:auto; padding:26px 32px 44px; }
  .pane{ display:none; } .pane.on{ display:block; }
  h2{ font-size:19px; margin-bottom:4px; font-weight:700; }
  .sub{ color:var(--dim); font-size:12.5px; margin-bottom:20px; }
  #p-match h2{ margin-bottom:16px; }   /* 没有小字了，标题和框拉开一点 */

  /* ── 表单 ── */
  .row{ display:flex; gap:10px; margin-bottom:12px; max-width:440px; }
  input{ flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:9px;
         font:inherit; background:#fff; outline:none; font-size:14px; }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,85,61,.10); }
  button{ padding:11px 18px; border:0; border-radius:9px; font:inherit; font-weight:600;
          cursor:pointer; background:var(--accent); color:#fff; transition:.15s;
          white-space:nowrap; }
  button:hover{ filter:brightness(1.07); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.ghost{ background:#fff; color:var(--ink); border:1px solid var(--line); }

  /* ── 渠道客户端登录（Steam / 国际服 / B站）：复用本机游戏已登录的票 ── */
  .chbox{ border:1px solid var(--line); background:#FBF9F4; border-radius:11px;
          padding:13px 15px; margin-top:18px; max-width:440px; }
  .chhead{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .chdot{ width:8px; height:8px; border-radius:50%; background:#C9C0AE; flex:0 0 auto; }
  .chdot.on{ background:#7BA05B; }
  /* 右上角刷新：重新检测本机登录记录（用户开游戏登录后点一下就行） */
  .chref{ margin-left:auto; width:26px; height:26px; padding:0; flex:0 0 auto;
          display:flex; align-items:center; justify-content:center; cursor:pointer;
          background:transparent; border:1px solid transparent; border-radius:7px;
          color:#8C8271; }
  .chref:hover{ background:#F1EDE3; border-color:var(--line); color:#5A5142; }
  .chref.spin svg{ animation:chspin .8s linear infinite; }
  @keyframes chspin{ to{ transform:rotate(360deg); } }
  .chrow{ display:flex; gap:10px; margin-top:11px; }
  .chrow button{ flex:1; }
  /* 两个渠道按钮各用自家品牌色区分：Steam 蓝 / Bilibili 粉 */
  .chrow button.lgSteam{ background:#2C5C8F; border-color:#2C5C8F; color:#fff; }
  .chrow button.lgSteam:hover{ background:#244C79; border-color:#244C79; }
  .chrow button.lgBili{ background:#FB7299; border-color:#FB7299; color:#fff; }
  .chrow button.lgBili:hover{ background:#E85D86; border-color:#E85D86; }
  /* TapTap 品牌色：#00C4B2（以官方 PC 客户端 UI 实测取色为准；
     taptap.io 品牌资源页给的是 #28C290，偏绿，客户端没用它） */
  .chrow button.lgTap{ background:#00C4B2; border-color:#00C4B2; color:#fff; }
  .chrow button.lgTap:hover{ background:#00A697; border-color:#00A697; }
  /* 登录记录失效时的提示（按钮正下方） */
  .chmsg{ display:none; margin-top:9px; font-size:12px; color:#C0453A; }
  .chmsg.on{ display:block; }
  .chhint{ margin-top:10px; font-size:12px; line-height:1.75; color:var(--dim); }
  .chhint b{ color:#5A5142; }
  .chhint i{ font-style:normal; color:#A79C88; }
  .chhint i.warn{ color:#C0453A; }
  .orsep{ display:flex; align-items:center; gap:10px; margin:18px 0 4px;
          color:#A79C88; font-size:12px; max-width:440px; }
  .orsep:before, .orsep:after{ content:""; height:1px; background:var(--line); flex:1; }
  #msg{ margin-top:14px; font-size:13px; min-height:20px; max-width:440px; }
  #msg.ok{ color:var(--ok); } #msg.err{ color:var(--accent); } #msg.wait{ color:var(--dim); }

  /* ── 卡片 ── */
  .cards{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px;
          margin-bottom:22px; }
  @media (max-width:960px){ .cards{ grid-template-columns:repeat(3,1fr); } }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:15px 16px; }
  .card .k{ font-size:11.5px; color:var(--dim); margin-bottom:7px; }
  .card .v{ font-size:23px; font-weight:700; line-height:1.1;
            font-variant-numeric:tabular-nums; }
  .card .v small{ font-size:12px; font-weight:500; color:var(--dim); margin-left:3px; }

  /* ── 盒子 ── */
  .box{ background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:18px 20px; margin-bottom:18px; }
  .box h3{ font-size:14px; margin-bottom:14px; font-weight:600; }
  table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th{ text-align:left; color:var(--dim); font-weight:500; font-size:11.5px;
      padding:0 10px 9px 0; border-bottom:1px solid var(--line); }
  td{ padding:8px 10px 8px 0; border-bottom:1px solid #F2EFE7; vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  th.num, td.num{ text-align:center; }
  th.r, td.r{ text-align:right; }
  .num, .card .v, .stat{ font-variant-numeric:tabular-nums; }
  .hero-name{ display:flex; align-items:center; gap:9px; }
  .hero-name .hav{ width:44px; height:44px; border-radius:50%; flex:0 0 auto;
                   background:#EFEAD9; object-fit:cover; }
  .hero-name .hbody{ flex:1; min-width:0; }
  .hero-name .htop{ display:flex; align-items:baseline; gap:4px; }
  .hero-name b{ font-weight:600; }
  .tag{ display:inline-block; padding:1.5px 7px; border-radius:5px; font-size:11px;
        background:#EFEBE1; color:#8A8377; white-space:nowrap; }
  .tag.w{ background:#E3EFE5; color:var(--ok); }
  .bar{ height:5px; border-radius:3px; background:#EAE5DA; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; background:var(--accent); border-radius:3px; }
  .actions{ display:flex; gap:10px; margin-bottom:16px; }
  #p-export #out{ min-height:360px; max-height:calc(100vh - 268px); }

  /* ── 最近对局 ── */
  .mtab{ overflow-x:auto; overflow-y:hidden; padding-bottom:3px; }
  .mtab::-webkit-scrollbar{ height:7px; }
  .mtab::-webkit-scrollbar-thumb{ background:#D8CFBB; border-radius:4px; }
  .mtab::-webkit-scrollbar-track{ background:transparent; }
  .pl, .plhead{ display:grid;
    grid-template-columns:158px 78px 40px 44px 40px 40px 40px 44px 40px 42px;
    gap:6px; align-items:center; justify-content:start;
    min-width:634px; }
  .pl{ padding:5px 0; border-top:1px solid #F5F2EA; font-size:12.5px; }
  .pl:first-of-type{ border-top:0; }
  .pl.me{ background:#FBF7EC; border-radius:6px; }
  .pl .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4A4436; }
  .pl .nm .nmgo{ font-style:normal; font-size:12px; color:#BEB29A; margin-left:5px;
                 vertical-align:0px; }
  .pl .nm:hover .nmgo{ color:#B4633A; }
  .pl .nm em{ font-style:normal; font-size:9.5px; color:#fff; background:#C6A15B;
              border-radius:7px; padding:0 5px; margin-left:5px; vertical-align:1px; }
  .pl .hr{ display:flex; align-items:baseline; gap:4px; overflow:hidden; }
  .pl .hr b{ font-weight:600; font-size:12px; color:#4A4436; white-space:nowrap; }
  .pl .hr i{ font-style:normal; font-size:10.5px; color:#8C8471; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  .pl .n{ text-align:right; color:#6E6650; font-variant-numeric:tabular-nums; }
  .pl .n.hi{ color:#8A6420; }
  .pl .n.top{ color:#C0562A; font-weight:700; }
  .plhead{ font-size:10px; color:#BDB6A4; padding-bottom:3px; }
  .plhead .n{ text-align:right; }
  .mini{ font-size:11px; font-weight:400; color:#8A8060; background:#EAE3D2;
         border-radius:9px; padding:2px 9px; margin-left:9px; cursor:pointer;
         vertical-align:2px; }
  .mini:hover{ background:#E0D7C0; }
  .mnote b{ color:#8A6420; font-weight:600; }
  .mload{ font-size:12px; color:#A79F8C; padding:10px 0; text-align:center; }

  /* ── ★ 对局复盘弹窗（点玩家名）── */
  .pl .nm{ cursor:pointer; }
  .pl .nm:hover{ color:#B4633A; }
  .pl .nm:hover .nmt{ text-decoration:underline; text-underline-offset:2px; }
  .rv{ position:fixed; inset:0; z-index:140; display:flex; align-items:center;
       justify-content:center; background:rgba(62,56,46,.34); transition:opacity .18s; }
  .rv.hide{ opacity:0; pointer-events:none; }
  .rvbox{ width:min(700px,90vw); max-height:87vh; background:#FCFAF6; border-radius:16px;
          box-shadow:0 22px 60px rgba(70,60,40,.32); display:flex; flex-direction:column;
          overflow:hidden; }
  .rvhead{ padding:13px 20px 11px; border-bottom:1px solid var(--line); display:flex;
           align-items:flex-start; gap:8px; }
  .rvhead .rhtxt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .rvhead .rav{ width:58px; height:58px; border-radius:50%; object-fit:contain; flex:0 0 58px;
                background:transparent; align-self:center; display:none; }
  .rhuid{ display:flex; align-items:center; gap:9px; }
  .rvhead .ruid{ font-size:11.5px; color:#A79F91; letter-spacing:.3px; cursor:pointer; }
  .rvhead .ruid:hover{ color:#B4633A; }
  .qcp{ display:inline-flex; align-items:center; justify-content:center; width:19px; height:18px;
        flex:0 0 auto; vertical-align:-3.5px; border:1px solid #DDD3BF; border-radius:6px;
        color:#8C8270; cursor:pointer; }
  .qcp:hover{ border-color:#B4633A; color:#B4633A; background:#FBF6EE; }
  /* 复制成功的小提示：从锚点上方跳一下，然后慢慢淡掉 */
  .qtoast{ position:fixed; z-index:9999; pointer-events:none; font-size:12px; color:#fff;
           background:#B4633A; padding:3px 10px; border-radius:9px; white-space:nowrap;
           box-shadow:0 4px 14px rgba(150,90,50,.28); animation:qpop 1.15s ease-out forwards; }
  @keyframes qpop{
    0%  { opacity:0; transform:translateY(4px) scale(.92); }
    16% { opacity:1; transform:translateY(-7px) scale(1); }
    68% { opacity:1; transform:translateY(-10px) scale(1); }
    100%{ opacity:0; transform:translateY(-22px) scale(.97); }
  }
  /* 复盘查询 · 玩家简况：单行紧凑，避免大白框里只放两行字 */
  .qme{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
        padding:7px 12px; background:#fff; border-radius:9px; margin:0 0 10px; }
  .qme>b{ font-size:15px; color:#3F3A2E; }
  .qme .quid{ font-size:12px; color:#A79F91; cursor:pointer; }
  .qme .quid b{ color:#6E6656; font-weight:600; }
  .qme .quid:hover b{ color:#B4633A; }
  .qme .quid .qcp{ margin-left:8px; }
  .qme .qsub{ font-size:12px; color:var(--dim); }
  .qme .qsub b{ color:#3F3A2E; font-weight:600; }
  .rvhead .rn{ font-size:16px; font-weight:700; color:#3F3A2E; }
  .rvhead .rh{ font-size:12px; color:var(--dim); display:flex; align-items:baseline;
               gap:3px; flex-wrap:wrap; }
  .rvhead .rh .rhero{ color:#3F3A2E; font-weight:600; }
  .rvhead .rh .rsplit{ color:#C4BAA6; font-size:11px; }
  /* 名字后面的等级 Lv.xx：比名字弱一档，不抢主体 */
  .rvhead .rn .rlv{ font-style:normal; font-size:12px; font-weight:500;
                    color:#A79F91; margin-left:5px; letter-spacing:.2px; }
  /* 我的信息：玩家名后的等级 + 渠道标签（四色区分：飞魔通行证/Steam/Bilibili/TapTap） */
  #nick .nlv{ font-style:normal; font-size:13px; font-weight:500;
              color:#A79F91; margin-left:7px; letter-spacing:.2px; }
  #nick .chtag{ display:inline-block; margin-left:8px; padding:1px 8px 2px;
                font-size:11px; line-height:16px; font-weight:600; color:#fff;
                border-radius:9px; vertical-align:3px; letter-spacing:.3px; }
  .chtag.t-phone{ background:#B4633A; }
  .chtag.t-steam{ background:#2C5C8F; }
  .chtag.t-bilibili{ background:#FB7299; }
  .chtag.t-taptap{ background:#00C4B2; }
  /* 手机登录方式切换：验证码 ⇄ 密码（挂在“或使用…”那行右端）
     ⚠ 那行两侧的横线是 .orsep:before/:after 画的 —— 绝对定位的链接会正压在上面，
     看着就像被划掉。所以要用背景色把线盖住，且链接自己不能再加下划线。 */
  .orsep{ position:relative; }
  .orsep .sw{ position:absolute; right:0; top:50%; transform:translateY(-50%);
              font-size:12px; line-height:1; color:#B4633A; cursor:pointer;
              user-select:none; background:var(--bg); padding:2px 7px;
              border-radius:4px; }
  .orsep .sw:hover{ color:#8E4A2A; background:#F7F4EC; }
  /* 手机登录行：密码框里的“显示密码”图标按钮（仅密码模式可见） */
  .row .pw{ position:relative; flex:1; display:flex; min-width:0; }
  .row .pw input{ flex:1; min-width:0; padding-right:34px; }
  .row .eye{ position:absolute; right:5px; top:50%; transform:translateY(-50%);
             display:none; width:26px; height:26px; padding:0;
             align-items:center; justify-content:center;
             background:transparent; border:0; border-radius:6px;
             color:#A79F91; cursor:pointer; }
  .row .eye:hover{ color:var(--ink); background:#EDE7DA; }
  body.pwdmode #btnCode{ display:none; }
  body.pwdmode .row .eye{ display:flex; }
  .rvhead .rx{ margin-left:auto; cursor:pointer; color:#A79F91; font-size:15px;
               padding:2px 8px; border-radius:7px; }
  .rvhead .rx:hover{ background:#EDE7DA; color:var(--ink); }
  .rvbody{ padding:14px 20px 20px; overflow-y:auto; }
  .rvsec{ margin-bottom:17px; }
  .rvsec>h4{ font-size:13px; color:#4E4739; font-weight:700; letter-spacing:0;
             margin:0 0 9px; padding-left:9px; border-left:3px solid #C6A15B; }
  /* ★ 内容跟标题文字对齐：标题文字左缘 = 3px 竖条 + 9px 内距 = 12px */
  .rvsec>*:not(h4){ margin-left:12px; }
  .rvsec .rtab{ width:calc(100% - 12px); }
  .rvsec .rtab tr>*:first-child{ padding-left:0; }
  .rtab{ width:100%; border-collapse:collapse; font-size:12.5px;
         font-variant-numeric:tabular-nums; }
  .rtab th{ font-weight:600; color:#B0A995; font-size:11px; padding:5px 4px;
            border-bottom:1px solid var(--line); text-align:center; }
  .rtab th:first-child, .rtab td:first-child{ text-align:left; width:58px; }
  .rtab td{ padding:5px 4px; text-align:center; border-bottom:1px solid #F1ECE2;
            color:#5E574A; }
  .rtab td.top{ color:#C0562A; font-weight:700; }
  .rtab tr.died td{ background:#FBF1EA; }
  .rtab tfoot td{ border-top:1px solid var(--line); border-bottom:none;
                  font-weight:700; color:#4E4739; padding-top:7px; }
  .qk{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;
       vertical-align:1px; }
  .qk.q蓝{ background:#6E8FC7; } .qk.q紫{ background:#A66BD6; } .qk.q金{ background:#D3A432; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ background:#F5F1E7; border:1px solid #E5DDCB; border-radius:8px;
         padding:4px 9px; font-size:12px; color:#5E574A; white-space:nowrap; }
  .chip .src{ font-size:10.5px; color:#A79F91; margin-left:4px; }
  .rev{ border-top:1px solid #F1ECE2; padding:9px 0 7px; }
  .rev .r1{ font-size:11.5px; color:#A79F91; margin-bottom:6px; }
  .rev .r1 b{ color:#6E6650; font-weight:600; }
  .rev .r2{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }

<script>
const $ = s => document.querySelector(s);
function nav(p){
  document.querySelectorAll('.pane').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('on', e.dataset.p===p));
  $('#p-'+p).classList.add('on');
}
document.querySelectorAll('.nav').forEach(e=>e.onclick=()=>{
  if(!e.classList.contains('lock')) nav(e.dataset.p); });
function say(t, cls){ const m=$('#msg'); m.textContent=t; m.className=cls||''; }
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(ts*1000);
  if(isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

window.renderStats = (r, st, mi) => {
  const esc = window.__esc;
  const ps = r.players || [];
  const S = p => (st[String(p.id)] || {}).stats || {};
  const kk = '击杀';                                // 后端已换算成官方口径（含怪物/盗贼）
  const cols = [kk, '伤害', '承伤', '死亡', '治疗', '星币', '转账', '步数'];
  const LAB = {};
  // 每列最大值（>0 才强调，全 0 不高亮）
  const best = {};
  cols.forEach(k => { best[k] = Math.max(0, ...ps.map(p => S(p)[k] || 0)); });

  const rows = ps.map(p => {
    const s = S(p);
    const c = k => {
      const v = s[k] || 0;
      const isTop = best[k] > 0 && v === best[k];
      const amber = (k === '星币');
      return `<div class="n${amber?' hi':''}${isTop?' top':''}">${v}</div>`;
    };
    return `<div class="pl${p.me?' me':''}">
      <div class="nm" onclick="openReview(${mi}, '${p.id}')" title="点击查看 TA 的对局复盘"><span class="nmt">${esc(p.name)}</span>${p.me?'<em>我</em>':''}<i class="nmgo">▸</i></div>
      <div class="hr"><b>${p.hero}</b></div>
      ${cols.map(c).join('')}
    </div>`;
  }).join('');

  const head = `<div class="plhead"><div>玩家</div><div>角色</div>
      ${cols.map(k=>`<div class="n">${LAB[k]||k}</div>`).join('')}</div>`;
  const sum = k => ps.reduce((a,p)=>a+(S(p)[k]||0), 0);
  return `<div class="mtab">${head}${rows}</div>
    <div class="mnote"><span>总${LAB[kk]||kk} <b>${sum(kk)}</b>　总伤害 <b>${sum('伤害')}</b>
      　总承伤 <b>${sum('承伤')}</b>　总星币 <b>${sum('星币')}</b></span></div>`;
};


// ── 渠道客户端登录（Steam / Bilibili）：复用本机客户端留下的登录记录 ──
// 两家客户端都会把长效票写进自己的日志（约 30 天），所以【不必让游戏保持在线】；
// 没有记录时才回退去读运行中客户端的内存。
// 关键：点按钮之前就把"会登成哪个号"亮出来（没有就明说"未检测到"）。
// 右上角刷新按钮 = 重跑一遍检测：用户中途去开游戏登录后，点它就能看到检测成功。
let CH = { s: '', b: '' };             // 当前检测到的两个账号名（空串 = 未检测到）
let CHWarn = false;                    // 第 1 条是否该标红（重绘提示时要保留）

function chRedNote1(on){               // 第 1 条提示变红：点了按钮却没账号可登
  CHWarn = !!on;
  const els = document.querySelectorAll('#chHint i');
  if(els[0]) els[0].className = on ? 'warn' : '';
}
function chSay(msg){                   // 按钮正下方的失效提示
  const el = $('#chMsg');
  if(!el) return;
  el.textContent = msg || '';
  el.className = msg ? 'chmsg on' : 'chmsg';
}
async function channelState(){
  const dot = $('#chDot'), hint = $('#chHint'), ref = $('#chRef');
  if(ref) ref.className = 'chref spin';
  if(hint) hint.innerHTML = '正在检查本机的登录记录…';
  chSay(''); chRedNote1(false);
  let s = null, b = null, t = null;
  try{
    const r = await Promise.all([window.pywebview.api.steam_state(),
                                 window.pywebview.api.bili_state(),
                                 window.pywebview.api.taptap_state()]);
    s = r[0]; b = r[1]; t = r[2];
  }catch(e){}
  // Steam：先用客户端登录记录；没有记录才去问内存（游戏正开着时能读到）
  let sName = (s && s.log && s.log.user) || '';
  if(!sName){
    try{
      const a = await window.pywebview.api.steam_account();
      const one = (a && a.ok && (a.sessions || [])[0]) || {};
      if(one.label) sName = String(one.label).replace(/^Steam 登录 · /, '').trim();
    }catch(e){}
  }
  const bName = (b && b.ok && b.user) ? b.user : '';
  const tName = (t && t.ok && t.user) ? t.user : '';
  CH = { s: sName, b: bName, t: tName };
  if(dot) dot.className = 'chdot' + (sName || bName || tName ? ' on' : '');
  if(ref) ref.className = 'chref';
  if(!hint) return;
  hint.innerHTML =
      (sName ? '检测到Steam游戏账号：<b>' + sName + '</b>' : '未检测到Steam游戏账号')
    + '<br>' + (bName ? '检测到Bilibili游戏账号：<b>' + bName + '</b>'
                      : '未检测到Bilibili游戏账号')
    + '<br>' + (tName ? '检测到TapTap游戏账号：<b>' + tName + '</b>'
                      : '未检测到TapTap游戏账号')
    + '<br><i' + (CHWarn ? ' class="warn"' : '') + '>1·若未检测到游戏账号，'
    + '则使用对应渠道登录一次游戏，再刷新本页面</i>'
    + '<br><i>2·本工具登录会将游戏挤下线，属正常现象，待进入主页后，可再登进游戏</i>';
}

// 失败收尾：把"已失效，请重新登录一次"留在按钮下方（重扫会清提示，扫完再放回）
function chDone(r){
  if(r && r.ok) return true;
  const msg = (r && r.msg) || '登录失败';
  say(msg,'err');
  chSay(msg);
  if(r && (r.expired || r.need_login)){
    // 先重扫一遍（能发现记录已不在/仍失效），扫完再把提示和红字放回去
    channelState().then(()=>{ chSay(msg); chRedNote1(true); });
  }
  return false;
}

const SICON = {
  desc: '<svg viewBox="0 0 12 12"><path d="M6 1.8v7.1M3.3 6.2 6 8.9l2.7-2.7"/></svg>',
  asc:  '<svg viewBox="0 0 12 12"><path d="M6 10.2V3.1M3.3 5.8 6 3.1l2.7 2.7"/></svg>',
  off:  '<svg viewBox="0 0 12 12"><path d="M3.9 4.3 6 2.2l2.1 2.1M3.9 7.7 6 9.8l2.1-2.1"/></svg>',
};

// ── 我的信息：角色使用排行 ──
const HSORT_DEF = {key:'n', dir:'desc'};      // 默认排序：场次从高到低
const HSORT_CYCLE = {                          // 每列点击循环，null = 回到默认
  name: [{key:'id', dir:'asc'}, {key:'id', dir:'desc'}, null],
  n:    [{key:'n', dir:'desc'}, {key:'n', dir:'asc'}, null],
  w:    [{key:'w', dir:'desc'}, {key:'w', dir:'asc'}, null],
  rate: [{key:'rate', dir:'desc'}, {key:'rate', dir:'asc'}, null],
};
window.__hSort = Object.assign({}, HSORT_DEF);
function heroVal(h, key){
  if(key === 'id')   return Number(h.id) || 0;
  if(key === 'w')    return Number(h.w) || 0;
  if(key === 'rate') return h.n ? (Number(h.w) || 0) / h.n : -1;
  return Number(h.n) || 0;
}
window.hSort = col => {
  const cyc = HSORT_CYCLE[col] || [];
  const s = window.__hSort;
  const hit = cyc.findIndex(o => o && o.key === s.key && o.dir === s.dir);
  const nxt = cyc[(hit + 1) % cyc.length];     // hit = -1 时正好从第一个开始
  window.__hSort = nxt ? Object.assign({}, nxt) : Object.assign({}, HSORT_DEF);
  window.paintHeroes();
};
window.paintHeroes = () => {
  const d = window.__profile; if(!d || !d.heroes) return;
  const s = window.__hSort || HSORT_DEF;
  const rows = d.heroes.slice().sort((a,b) => {
    // 按编号排时保持纯编号序；按其它列排时，未拥有的角色一律沉到最后，
    //   否则升序时满屏灰色行全挡在前面（用户明确要求）
    if(s.key !== 'id'){
      const oa = a.owned === false ? 1 : 0, ob = b.owned === false ? 1 : 0;
      if(oa !== ob) return oa - ob;
    }
    return ((s.dir === 'asc' ? 1 : -1) * (heroVal(a, s.key) - heroVal(b, s.key)))
      || ((Number(b.n) || 0) - (Number(a.n) || 0))          // 并列时：场次从多到少
      || ((Number(a.id) || 0) - (Number(b.id) || 0));       // 再并列：按编号，保证顺序稳定
  });
  const max = Math.max(...rows.map(h => h.n), 1);
  // 服务端胜场统计少算的角色（角色卡场次与服务端条件计数对不上）在胜场/胜率后标一个问号点
  const STALE2 = '<span class="qstale" data-tip="该角色的服务端胜场统计少算">?</span>';
  document.getElementById('heroes').innerHTML = rows.map(h=>`<tr${h.owned===false?' class="noh"':''}>
      <td>
        <div class="hero-name">
          ${avOf(h.id) ? `<img class="hav" alt="" src="${avOf(h.id)}">` : '<span class="hav"></span>'}
          <div class="hbody">
            <div class="htop"><b>${h.name}</b>${h.title?`<i>${h.title}</i>`:''}</div>
            <div class="bar"><i style="width:${100*h.n/max}%"></i></div>
          </div>
        </div>
      </td>
      <td class="num">${h.n||'—'}</td>
      <td class="num">${h.w||'—'}${h.stale?STALE2:''}</td>
      <td class="num">${h.n?Math.round(100*h.w/h.n)+'%':'—'}${h.stale?STALE2:''}</td>
      <td class="num">${Number.isFinite(h.lv)?h.lv:'—'}</td>
      <td class="num">${h.owned===false?'—':(h.brk==='已激发'?'<span class="tag pur">已激发</span>':(h.brk==='未开放'?'<span class="tag off">问了吗</span>':'<span class="tag">未</span>'))}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
  sbtnPaint('sbn_name', s.key === 'id' ? 'asc' : 'off');
  sbtnPaint('sbn_n',    s.key === 'n'  ? (s.dir === 'asc' ? 'asc' : 'desc') : 'off');
  sbtnPaint('sbn_w',    s.key === 'w'  ? (s.dir === 'asc' ? 'asc' : 'desc') : 'off');
  sbtnPaint('sbn_rate', s.key === 'rate' ? (s.dir === 'asc' ? 'asc' : 'desc') : 'off');
};
// ── 我的皮肤 ──
window.__skSort = {key:'id', dir:'asc'};      // 默认：按角色编号
window.skSort = key => {
  const s = window.__skSort;
  if(s.key === key) s.dir = (s.dir === 'asc' ? 'desc' : 'asc');     // 再点同一项 ⇒ 翻方向
  else window.__skSort = {key:key, dir: key === 'id' ? 'asc' : 'desc'};
  renderSkins(window.__profile || {});
};
window.skDir = () => {
  const s = window.__skSort;
  s.dir = (s.dir === 'asc' ? 'desc' : 'asc');
  renderSkins(window.__profile || {});
};
function renderSkins(d){
  const sk = d.skins || {list:[],named:0,bond:0,sum:0};
  const el = document.getElementById('skinSub');
  if(el) el.innerHTML = `共 <b>${sk.sum}</b>/${sk.sk_total} 套　·　拥有角色 <b>${sk.hero_have}</b>/${sk.hero_total} 位　·　缔结契约 <b>${sk.contract}</b> 位`;
  const box = document.getElementById('skinList');
  if(!box) return;
  if(!sk.list || !sk.list.length){ box.innerHTML = '<div class="empty">没有读到皮肤数据</div>'; return; }
  const s = window.__skSort || {key:'id', dir:'asc'};
  const kk = (s.key === 'have' || s.key === 'total') ? s.key : 'id';
  const val = h => (kk === 'id' ? (Number(h.id) || 0) : (Number(h[kk]) || 0));
  const rows = sk.list.slice().sort((a,b) =>
    ((s.dir === 'asc' ? 1 : -1) * (val(a) - val(b)))
    || ((Number(a.id) || 0) - (Number(b.id) || 0)));
  box.innerHTML = rows.map(h=>
    `<div class="skrow${h.owns===false?' noh':''}">
      <div class="skhead"><b>${h.name}</b><i>${h.title||''}</i>${h.contract?'<u class="ctr">已婚</u>':''}<em>${h.have}/${h.total}</em></div>
      <div class="chips">${h.skins.map(x=>`<span class="chip${x.has?' on':''}">${x.name}</span>`).join('') || '<span class="empty">（Wiki 无记录）</span>'}</div>
    </div>`).join('');
  ['id','have','total'].forEach(k => {
    const t = document.getElementById('skb_' + k);
    if(t) t.className = 'stab' + (s.key === k ? ' on' : '');
  });
  sbtnPaint('skb_dir', s.dir === 'asc' ? 'asc' : 'desc');
}
function render(d){
  window.__profile = d;                       // 记住当前档案：补到头像新图后要重渲染（见 artPoll）
  try{ renderSkins(d); }catch(e){}
  // 玩家名后面挂等级 Lv.xx 与渠道标签；渠道取自 profile.channel（见后端 _finish_login）
  const esc = window.__esc = window.__esc || (v => String(v == null ? '' : v)
      .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
  const TAG = {phone:['飞魔通行证','t-phone'], steam:['Steam','t-steam'],
               bilibili:['Bilibili','t-bilibili'], taptap:['TapTap','t-taptap']};
  const tg = TAG[String(d.channel || 'phone')] || [String(d.channel || ''), 't-phone'];
  $('#nick').innerHTML = esc(d.nick)
      + (d.level ? '<i class="nlv">Lv.' + esc(d.level) + '</i>' : '')
      + '<span class="chtag ' + tg[1] + '">' + esc(tg[0]) + '</span>';
  $('#subline').textContent = `UID ${d.uid}`;
  const cards = [
    ['累计参与', d.total, '局'],
    ['累计胜利', d.wins, '局'],
    ['胜率', d.winrate, '%'],
    ['拥有角色', d.heroCount, '个'],
    ['拥有换装', d.adorn || '—', d.adorn ? '件' : ''],
    ['获赞', d.praise || '—', ''],
  ];
  $('#cards').innerHTML = cards.map(([k,v,u])=>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`
  ).join('');

  window.paintHeroes();                       // 角色使用排行（默认场次从高到低，表头可排序）

  const mmax = Math.max(...d.maps.map(m=>m.n), 1);
  $('#maps').innerHTML = d.maps.map(m=>`<tr>
      <td>${m.name}</td><td class="num">${m.n}</td>
      <td><div class="bar"><i style="width:${100*m.n/mmax}%"></i></div></td>
    </tr>`).join('') || '<tr><td colspan="3" class="empty">暂无数据</td></tr>';

  const recs = (d.recent || []).slice().sort((a,b)=>(b.time||0)-(a.time||0));  // 从新到旧
  window.__recs = recs;
  $('#matchBox').innerHTML = recs.length ? recs.map((r,i)=>`
    <div class="match" id="m${i}">
      <div class="mhead" onclick="toggleMatch(${i})">
        <div class="t">${fmtTime(r.time)}</div>
        <div class="m" id="map${i}">读取中…</div>
        <div class="res ${r.rank===1?'win':'lose'}">${r.rank===1?'胜利':(r.rank?'第'+r.rank+'名':'—')}</div>
        <div class="h">${r.hero}</div>
        <div class="arw">▶</div>
      </div>
      <div class="mbody" id="mb${i}"></div>
    </div>`).join('') : '<div class="empty">没有对局记录</div>';

  // 列表出来后再补地图名（后端每局只抓 8KB，秒级返回）
  (async () => {
    try{
      const r = await window.pywebview.api.match_maps();
      const mp = (r && r.maps) || {};
      recs.forEach((rec, i) => {
        const el = document.getElementById('map' + i);
        if(!el) return;
        const info = mp[String(rec.replayId)];
        const df = ((r && r.diffs) || {})[String(rec.replayId)];
        if(info && info.name){
          el.innerHTML = window.__esc(info.name) + dChip(df);   // 地图 + 难度标
          el.classList.add('got');
        }
        else { el.textContent = '未知地图'; el.classList.add('none'); }
      });
    }catch(e){
      recs.forEach((rec, i) => {
        const el = document.getElementById('map' + i);
        if(el){ el.textContent = '—'; el.classList.add('none'); }
      });
    }
  })();

  window.toggleMatch = i => {
    const el = document.getElementById('m'+i);
    const body = document.getElementById('mb'+i);
    const open = el.classList.toggle('open');
    if (open && !body.dataset.loaded) loadMatchStats(i, body);
  };

  window.loadMatchStats = async (i, body) => {
    body.dataset.loaded = '1';
    body.innerHTML = '<div class="mload">正在下载这一局的回放并解析…（约 1.2MB，首次稍慢）</div>';
    try {
      const r = await window.pywebview.api.load_match(i);
      if (!r || !r.ok) {
        body.innerHTML = '<div class="mload">✗ ' + window.__esc((r && r.msg) || '读取失败') + '</div>';
        body.dataset.loaded = '';
        return;
      }
      body.innerHTML = renderStats(window.__recs[i], r.stats, i);
    } catch (e) {
      body.innerHTML = '<div class="mload">✗ ' + window.__esc(e) + '</div>';
      body.dataset.loaded = '';
    }
  };

  // ── ★ 对局复盘弹窗（点玩家名）──
  window.__rvCache = {};

  window.openReview = async (mi, uid) => {
    document.getElementById('rvName').textContent = '正在解析…';
    document.getElementById('rvUid').textContent = '';
    document.getElementById('rvSub').textContent = '';
    const avL = document.getElementById('rvAv');
    avL.removeAttribute('src');
    avL.style.display = 'none';
    document.getElementById('rvBody').innerHTML =
      '<div class="mload">正在解析本局回放…（首次约 3~8 秒，同一局再开秒开）</div>';
    document.getElementById('rv').classList.remove('hide');
    try{
      let rv = window.__rvCache[mi];
      if(!rv){
        const r = await window.pywebview.api.load_review(mi);
        if(!r || !r.ok){
          document.getElementById('rvBody').innerHTML =
            '<div class="mload">✗ ' + window.__esc((r && r.msg) || '解析失败') + '</div>';
          return;
        }
        rv = r.review; window.__rvCache[mi] = rv;
      }
      window.renderReview(rv, uid);
    }catch(e){
      document.getElementById('rvBody').innerHTML =
        '<div class="mload">✗ ' + window.__esc(e) + '</div>';
    }
  };

  window.closeReview = () => document.getElementById('rv').classList.add('hide');

  window.renderReview = (rv, uid) => {
    const esc = window.__esc;
    const SRC = {star:'升星', task:'任务完成', shop:'商店购买', cycle:'循环往复', unknown:'未知'};
    const p = (rv.players || []).find(x => String(x.uid) === String(uid));
    if(!p){
      document.getElementById('rvBody').innerHTML = '<div class="mload">没找到这个玩家</div>';
      return;
    }
    const t = p.totals || {};
    const _ru = document.getElementById('rvUid');
    _ru.textContent = 'UID ' + p.uid;        // 纯文本，复制按钮是旁边的兄弟节点
    _ru.onclick = () => qCopy(p.uid);
    // 名字后面挂等级 Lv.xx（来自回放 Room 帧 model.Player#25）
    document.getElementById('rvName').innerHTML =
      window.__esc(p.nick) + (p.me ? '（我）' : '')
      + (p.level ? '<i class="rlv">Lv.' + p.level + '</i>' : '');
    // 顺序：角色 · 地图 · 顺位（角色稍作着重；UID 已移到名字上方）
    const sub = [];
    const heroTxt = p.hero_name || (p.hero_id ? '英雄' + p.hero_id : '');
    if(heroTxt) sub.push('<span class="rhero">' + window.__esc(heroTxt) + '</span>');
    if(rv.map_name) sub.push(window.__esc(rv.map_name) + dChip(rv.difficulty));
    if(p.slot !== undefined && p.slot !== null) sub.push(window.__esc((p.slot + 1) + ' 号位'));
    document.getElementById('rvSub').innerHTML =
      sub.join('<span class="rsplit">·</span>');
    // ★ 头部头像：优先游戏立绘头像（按角色+皮肤），拿不到回落到角色头像
    const avEl = document.getElementById('rvAv');
    const avSrc = p.photo || avOf(p.hero_id);
    if(avSrc){
      avEl.src = avSrc;
      avEl.style.display = 'block';
      avEl.onerror = function(){ avEl.style.display = 'none'; };
    }else{
      avEl.removeAttribute('src');
      avEl.style.display = 'none';
    }

    // ① 按轮次（最高值橙红加粗；该轮死了 → 承伤后标「（似了）」）
    const KS = [['kill','击杀'],['dmg','伤害'],['inj','承伤'],['gold','星币'],['move','步数']];
    const best = {};
    KS.forEach(kv => { best[kv[0]] = Math.max(0, ...((p.rounds||[]).map(r => r[kv[0]] || 0))); });
    let rows = '';
    (p.rounds || []).forEach(r => {
      rows += '<tr' + (r.died ? ' class="died"' : '') + '><td>' + r.round + '</td>';
      KS.forEach(kv => {
        const v = r[kv[0]] || 0;
        const cls = (best[kv[0]] > 0 && v === best[kv[0]]) ? ' class="top"' : '';
        rows += '<td' + cls + '>' + v + (kv[0] === 'inj' && r.died ? '(×_×;)' : '') + '</td>';
      });
      rows += '</tr>';
    });
    const tab = '<table class="rtab"><thead><tr><th>轮次</th>' +
      KS.map(kv => '<th>' + kv[1] + '</th>').join('') + '</tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td>合计</td>' +
      KS.map(kv => '<td>' + (t[kv[0]] || 0) + '</td>').join('') + '</tr></tfoot></table>';

    // ② 筹码总览（只列筹码，不带来源）
    const chips = (p.chips || []).map(c =>
      '<span class="chip"><i class="qk q' + esc(c.quality) + '"></i>' + esc(c.name) +
      '</span>').join('') || '<span class="rvfoot">本局没拿到筹码</span>';

    // ③ 获取筹码明细：按轮次分块 → 来源（升星/任务完成/商店购买/循环往复）→ 刷新链
    const byRound = {};
    (p.chip_events || []).forEach(e => {
      const k = (e.round === null || e.round === undefined) ? 0 : e.round;
      (byRound[k] = byRound[k] || []).push(e);
    });
    let revs = '';
    Object.keys(byRound).sort((a, b) => a - b).forEach(rd => {
      let blk = '<div class="rd"><h5>第 ' + rd + ' 轮</h5>';
      byRound[rd].forEach(e => {
        const hasArg = (e.arg !== null && e.arg !== undefined && e.arg !== '');
        const tname = (e.source === 'task' && rv.task_names && e.arg)
                      ? (rv.task_names[String(e.arg)] || '') : '';
        let rows = '';
        const chain = (e.chain && e.chain.length) ? e.chain
                    : [{names: e.candidates_name || [], picked: e.picked_index}];
        let anyChip = false;
        chain.forEach((g, gi) => {
          const names = g.names || [];
          if(!names.length) return;
          anyChip = true;
          if(gi > 0) rows += '<div class="crow"><span class="rf">刷新</span></div>';
          rows += '<div class="crow">' + names.map((n, i) =>
            '<span class="cand' + (i === g.picked ? ' pick q' + esc(e.quality) : '') + '">' +
            esc(n) + '</span>').join('') + '</div>';
        });
        if(!anyChip) rows = '<div class="crow"><span class="rvfoot">（这一笔没留下候选记录）</span></div>';
        blk += '<div class="acq"><div class="al">' +
          '<span class="src-txt s-' + e.source + '">' + (SRC[e.source] || '未知') + '</span>' +
          (hasArg ? '<span class="sarg">（' + e.arg + (tname ? ' · ' + esc(tname) : '') + '）</span>' : '') +
          '</div><div class="chain">' + rows + '</div></div>';
      });
      blk += '</div>';
      revs += blk;
    });

    // 页签用：把现成的两块内容缓存住，切页签 / 切手牌视图时复用
    window.__rvState = {
      rv: rv, uid: String(uid), tab: 'stats', detail: null,
      stats: {tab: tab, chips: chips, revs: revs, nchip: (p.chips || []).length}
    };
    window.drawRv();
  };

  // ── 复盘页签 + 手牌视图 ──
  //  手牌页签默认看「每轮手牌」总览：行=轮次、列=玩家，每格三组
  //  开局 / 获得 / 使用（每张卡占一行）；点玩家头像/名字切到他的逐轮明细。
  window.drawRv = () => {
    const S = window.__rvState;
    if(!S) return;
    document.getElementById('rvTabs').innerHTML =
      [['stats','对局统计'],['hand','手牌']].map(t =>
        '<a class="rvt' + (S.tab === t[0] ? ' on' : '') +
        '" onclick="rvTab(\'' + t[0] + '\')">' + t[1] + '</a>').join('');
    let html;
    if(S.tab === 'stats'){
      const c = S.stats;
      html = '<div class="rvsec"><h4>轮次数据</h4>' + c.tab + '</div>' +
             '<div class="rvsec"><h4>筹码总览（' + c.nchip + ' 个）</h4><div class="chips">' +
               c.chips + '</div></div>' +
             '<div class="rvsec"><h4>获取筹码明细</h4>' +
               (c.revs || '<div class="rvfoot">本局没有拿筹码记录</div>') + '</div>';
    }else if(S.detail){
      html = window.handDetail(S.rv, S.detail);
    }else{
      html = window.handMatrix(S.rv);
    }
    const b = document.getElementById('rvBody');
    b.innerHTML = html;
    b.scrollTop = 0;   // 切页签 / 切视图都回到顶部，别停在上一处滚动位置
  };
  window.rvTab = (t) => { window.__rvState.tab = t; window.__rvState.detail = null; window.drawRv(); };
  window.rvDetail = (uid) => {   // 顺带切到「手牌」页签：从统计页调用也能直接看明细
    window.__rvState.tab = 'hand'; window.__rvState.detail = String(uid); window.drawRv(); };
  window.rvBack = () => { window.__rvState.detail = null; window.drawRv(); };

  // A：每轮手牌总览（行 = 轮次，列 = 玩家，每格：开局 / 获得 / 使用）
    // A：每轮总览（行 = 轮次，列 = 玩家；每格三组：开局 / 获得 / 使用）
  //    ★ 牌「怎么来的」（商店/谁发的卡）回放里没有可靠记录 ⇒ 一律不标来源，只列牌。
  window.handMatrix = (rv) => {
    const esc = window.__esc;
    const ps = rv.players || [];
    const rows = rv.card_rounds || [];
    if(!rows.length)
      return '<div class="rvsec"><h4>每轮手牌</h4>' +
             '<div class="rvfoot">这局回放没解析到手牌数据</div></div>';
    const grp = (label, cs) => (!cs || !cs.length) ? '' :
      '<div class="hgrp"><span class="hlab">' + label + '</span>' +
      cs.map(c => '<span class="hc t-' + esc(c.type || 'x') + '">' + esc(c.name) + '</span>').join('') +
      '</div>';
    let head = '<tr><th class="hrt">轮次</th>';
    ps.forEach(p => {
      const av = avOf(p.hero_id);
      head += '<th><div class="hpl" onclick="rvDetail(\'' + p.uid + '\')" ' +
        'title="点开看这个玩家的逐轮明细">' +
        (av ? '<img class="hav" src="' + esc(av) + '" onerror="this.style.display=\'none\'">'
            : '<span class="hav"></span>') +
        '<span class="hnm">' + esc(p.nick) + '</span></div></th>';
    });
    let body = '';
    rows.forEach(r => {
      body += '<tr><th class="hrt">第 ' + r.round + ' 轮</th>';
      ps.forEach(p => {
        const d = (r.players || {})[String(p.uid)] || {};
        body += '<td>' + (grp('开局', d.start) || '<span class="rvfoot">—</span>') + '</td>';
      });
      body += '</tr>';
    });
    return '<div class="rvsec"><h4>每轮手牌</h4>' +
      '<div class="rvhint" style="margin:-2px 0 8px 12px">' +
      '点玩家头像或名字，看他的逐轮明细</div>' +
      '<table class="htab"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      '</div></div>';
  };

  // B：单人逐轮明细（每轮：开局 / 获得 / 使用）
  window.handDetail = (rv, uid) => {
    const esc = window.__esc;
    const p = (rv.players || []).find(x => String(x.uid) === String(uid));
    if(!p)
      return '<div class="rvsec"><div class="rvfoot">没找到这个玩家</div></div>';
    const av = avOf(p.hero_id);
    // label 与卡牌同一行（不换行）；获得用虚线框、使用用划掉线
    const row = (label, cls, cs, extra) => (!cs || !cs.length) ? '' :
      '<div class="crow"><span class="' + cls + '">' + label + '</span>' +
      cs.map(c => '<span class="hc t-' + esc(c.type || 'x') + (extra ? ' ' + extra : '') + '">' +
                  esc(c.name) + '</span>').join('') +
      '</div>';
    let out = '<div class="rvsec"><h4 class="rvtit">' +
      '<a class="rvbk" onclick="rvBack()">\u2039 每轮手牌</a>' +
      (av ? '<img class="hav" src="' + esc(av) + '" onerror="this.style.display=\'none\'">' : '') +
      '<span>' + esc(p.nick) + ' 的逐轮明细</span></h4>';
    let any = false;
    (rv.card_rounds || []).forEach(r => {
      const d = (r.players || {})[String(uid)] || {};
      if(!(d.start || []).length && !(d.gets || []).length && !(d.uses || []).length) return;
      any = true;
      out += '<div class="rd"><h5>第 ' + r.round + ' 轮</h5>' +
             row('开局', 'rf st', d.start) + row('获得', 'rf gt', d.gets, 'dashed') +
             row('使用', 'rf ut', d.uses, 'used') + '</div>';
    });
    if(!any) out += '<div class="rvfoot">这局没有解析到这个玩家的手牌记录</div>';
    return out;
  };
}

function tip(msg, bad){
  const box = document.getElementById('saveMsg');
  if(!box) return;
  box.textContent = msg ? ((bad ? '⚠ ' : '✓ ') + msg) : '';
  box.className = 'savemsg' + (msg ? ' on' : '') + (bad ? ' bad' : '');
}
async function loadText(){
  $('#out').textContent = '正在生成…';
  const r = await window.pywebview.api.export_text();
  window.__exported = !!(r && r.ok);
  $('#out').textContent = r.ok ? r.text : r.msg;
  tip('');
}
async function copyText(btn){
  if(!window.__exported){ tip('请先点「生成档案文本」，生成后才能复制', true); return; }
  try{
    await navigator.clipboard.writeText($('#out').textContent || '');
    tip('档案文本已复制到剪贴板　' + new Date().toLocaleTimeString('zh-CN', {hour12:false}));
  }catch(e){ tip('复制失败，请手动选中下面的文本框复制', true); }
}
async function saveText(btn){
  if(!window.__exported){ tip('请先点「生成档案文本」，生成后才能保存', true); return; }
  if(btn){ btn.disabled = true; btn.textContent = '选择保存位置…'; }
  try{
    const r = await window.pywebview.api.save_export();
    if(!r.ok){ tip(r.msg === '已取消保存' ? '' : (r.msg || '保存失败'), true); }
    else { tip('markdown 文件已保存至「' + r.path + '」　　保存时间：' + r.saved_at); }
  }catch(e){ tip('保存失败：' + e, true); }
  if(btn){ btn.disabled = false; btn.textContent = '保存为markdown文件'; }
}

// ── ★ 复盘查询：一个输入框自动识别「回放号 / UID」──
function qesc(v){
  return String(v==null?'':v).replace(/[&<>"]/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
// 难度标（颜色区分）：0 普通 / 1 困难 / 2 噩梦 / 3 疯狂 / 4 极限
const DIFF_NAME = ['普通', '困难', '噩梦', '疯狂', '极限'];
function dChip(n){
  if(n === null || n === undefined || n === '') return '';
  const v = Number(n);
  if(!(v >= 0 && v <= 4)) return '';
  return '<span class="dh dh' + v + '">' + DIFF_NAME[v] + '</span>';
}

function qsay(msg, bad){
  const box = document.getElementById('qmsg');
  if(!box) return;
  box.textContent = msg ? ((bad ? '⚠ ' : '✓ ') + msg) : '';
  box.className = 'savemsg' + (msg ? ' on' : '') + (bad ? ' bad' : '');
}
function qDate(ts){
  if(!ts) return '—';
  const d = new Date(ts*1000);
  if(isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 16 位回放号超出 JS 安全整数范围，必须当字符串传给复盘弹窗（内部只当缓存键用）
function qref(rid){ return "'" + String(rid) + "'"; }

async function doQuery(){
  const raw = ((document.getElementById('qin') || {}).value || '').trim();
  const box = document.getElementById('qbox');
  if(!raw){ qsay('请先输入回放号或 UID', true); return; }
  qsay('');
  box.innerHTML = '<div class="mload">查询中…</div>';
  let r;
  try{ r = await window.pywebview.api.query(raw); }
  catch(e){ box.innerHTML = '<div class="mload">✗ ' + qesc(e) + '</div>'; return; }
  if(!r || !r.ok){
    box.innerHTML = '<div class="mload">✗ ' + qesc((r && r.msg) || '查询失败') + '</div>';
    return;
  }
  if(!window.__esc) window.__esc = qesc;      // 未登录时 renderStats 也要能转义

  if(r.kind === 'replay'){
    qsay('已取到这一局的回放数据' + (r.map_name ? '（' + r.map_name + '）' : ''));
    const rec = (r.records || [])[0] || {};
    box.innerHTML = `<div class="match open">
      <div class="mhead">
        <div class="t">回放号 ${qesc(r.replay_id)}</div>
        <div class="m got">${qesc(r.map_name || '未知地图')}${dChip(r.difficulty)}</div>
        <div class="res">对局</div>
        <div class="h"></div>
        <div class="arw">▶</div>
      </div>
      <div class="mbody" id="qbody"></div>
    </div>`;
    const body = document.getElementById('qbody');
    body.dataset.loaded = '1';
    body.innerHTML = renderStats(rec, r.stats || {}, qref(r.replay_id));
    return;
  }

  // ── UID：简况 + 最近 10 局 ──
  const st = r.statistics || {};
  const all = st.fightCount || 0, win = st.winFightCount || 0;
  const rate = all ? (100 * win / all).toFixed(1) : '—';
  qsay('已取到 ' + (r.nick || ('UID ' + r.uid)) + ' 的最近对局');
  const head = `<div class="qme"><b>${qesc(r.nick || ('UID ' + r.uid))}</b>
      <span class="quid" onclick="qCopy('${r.uid}', this)" title="复制 UID">UID <b>${r.uid}</b><i class="qcp" onclick="event.stopPropagation();qCopy('${r.uid}', this)">${QCP_ICON}</i></span>
      <span class="qsub">${r.level ? '等级 ' + r.level + ' · ' : ''}${r.online ? '在线' : '离线'}
      · 总场次 <b>${all}</b> · 胜场 <b>${win}</b>（${rate}%）
      · 皮肤 <b>${st.skinCount || 0}</b> · 获赞 <b>${st.praiseNum || 0}</b></span></div>`;
  const recs = r.records || [];
  window.__qrecs = recs;
  if(!recs.length){
    box.innerHTML = head + '<div class="box"><div class="empty">这个玩家最近没有可查的对局</div></div>';
    return;
  }
  box.innerHTML = head + '<div class="box">' + recs.map((rec, i) => `
    <div class="match" id="qm${i}">
      <div class="mhead" onclick="toggleQ(${i})">
        <div class="t">${qDate(rec.time)}</div>
        <div class="m${rec.map_name ? ' got' : ''}" id="qmap${i}">${qesc(rec.map_name || '—')}${dChip(rec.difficulty)}</div>
        <div class="res ${rec.rank===1?'win':'lose'}">${rec.rank===1?'胜利':(rec.rank?'第'+rec.rank+'名':'—')}</div>
        <div class="h">${qesc(rec.hero || '')}</div>
        <div class="arw">▶</div>
      </div>
      <div class="mbody" id="qmb${i}"></div>
    </div>`).join('') + '</div>';
}

// 复制按钮的图标（内联 SVG：两个叠起来的方框；界面里不允许用 emoji）
const QCP_ICON = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">'
  + '<rect x="5.6" y="1.6" width="8.8" height="9.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>'
  + '<path d="M11.2 14.4H3.6a2 2 0 0 1-2-2V4.8" fill="none" stroke="currentColor" stroke-width="1.5"'
  + ' stroke-linecap="round" stroke-linejoin="round"/></svg>';

// 复制成功的小提示：从锚点上方跳一下，然后慢慢淡掉
window.qToast = (text, anchor) => {
  const el = document.createElement('div');
  el.className = 'qtoast';
  el.textContent = text;
  el.style.left = '0px';
  el.style.top = '-999px';
  document.body.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const r = (anchor && anchor.getBoundingClientRect) ? anchor.getBoundingClientRect() : null;
  const cx = r ? r.left + r.width / 2 : window.innerWidth / 2;
  const cy = r ? r.top : 90;
  el.style.left = Math.round(cx - w / 2) + 'px';      // 量完宽高再定位，比 translate(-50%) 稳
  el.style.top = Math.round(cy - h - 6) + 'px';       // 浮在锚点上方
  // 动画结束就撤（比定时器可靠：后台/无头页面会把 setTimeout 节流），定时器只兜底
  el.addEventListener('animationend', () => { if(el.parentNode) el.parentNode.removeChild(el); });
  setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 2000);
};

// 复制到剪贴板：先试浏览器剪贴板，不行走后端原生（WebView 里 file:// 页面不可靠）
window.qCopy = async (text, anchor) => {
  const s = String(text == null ? '' : text);
  if(!s) return;
  let ok = false;
  try{ await navigator.clipboard.writeText(s); ok = true; }catch(e){ ok = false; }
  if(!ok){
    try{ const r = await window.pywebview.api.copy_text(s); ok = !!(r && r.ok); }catch(e){ ok = false; }
  }
  if(ok) qToast('已复制 ' + s, anchor || null);
  else qsay('复制失败，请手动选中复制', true);
};

// 复盘弹窗 UID 旁边的图标按钮（UID 文本在 #rvUid 里）
window.qCopyUid = (el) => {
  const u = document.getElementById('rvUid');
  qCopy((u ? u.textContent : '').replace(/^UID\s*/, '').trim(), el || u);
};

// 静态 HTML 里的复制按钮补上图标
document.querySelectorAll('.qcp').forEach(el => { if(!el.innerHTML.trim()) el.innerHTML = QCP_ICON; });

// 清空复盘查询面板（退出登录时调用：上次的查询结果不该留到下次登录）
window.qReset = () => {
  const i = document.getElementById('qin'); if(i) i.value = '';
  const b = document.getElementById('qbox'); if(b) b.innerHTML = '';
  const m = document.getElementById('qmsg');
  if(m){ m.textContent = ''; m.className = 'savemsg'; }
  document.querySelectorAll('.qtoast').forEach(e => e.remove());
  window.__qrecs = null;
  if(typeof window.closeReview === 'function') window.closeReview();
};

window.toggleQ = i => {
  const el = document.getElementById('qm' + i);
  const body = document.getElementById('qmb' + i);
  const open = el.classList.toggle('open');
  if(open && !body.dataset.loaded) loadQStats(i, body);
};

window.loadQStats = async (i, body) => {
  body.dataset.loaded = '1';
  const rec = (window.__qrecs || [])[i] || {};
  const rid = String(rec.replayId || '');
  body.innerHTML = '<div class="mload">正在下载这一局的回放并解析…（首次稍慢，同一局再开秒开）</div>';
  try{
    const r = await window.pywebview.api.load_match(rid);
    if(!r || !r.ok){
      body.innerHTML = '<div class="mload">✗ ' + qesc((r && r.msg) || '读取失败') + '</div>';
      body.dataset.loaded = '';
      return;
    }
    const mapEl = document.getElementById('qmap' + i);
    if(mapEl && r.map_name){
      // 用 innerHTML：textContent 会把难度标一起抹掉
      mapEl.innerHTML = qesc(r.map_name) + dChip(rec.difficulty);
      mapEl.classList.remove('none');
      mapEl.classList.add('got');
    }
    if(!window.__esc) window.__esc = qesc;
    body.innerHTML = renderStats({players: r.players || rec.players || []}, r.stats || {}, qref(rid));
  }catch(e){
    body.innerHTML = '<div class="mload">✗ ' + qesc(e) + '</div>';
    body.dataset.loaded = '';
  }
};

// 版本号由后端注入（唯一真源 = main.py 的 VERSION）
window.addEventListener("pywebviewready", () => {
  window.pywebview.api.login_state().then(d => {
    const e = document.getElementById("verTag");
    if (e && d && d.version) e.textContent = "版本 " + d.version;
  }).catch(() => {});
});
</script>
